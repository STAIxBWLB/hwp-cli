[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.17.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
# Internal crates
hwp-model = { path = "crates/hwp-model" }
hwp5 = { path = "crates/hwp5" }
hwpx = { path = "crates/hwpx" }
hwp-convert = { path = "crates/hwp-convert" }
hwp-render = { path = "crates/hwp-render" }

# Shared external dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cfb = "0.14"
flate2 = "1"
quick-xml = "0.40"
libc = "0.2"
resvg = { version = "=0.47.0", default-features = false }
regex = "1.11"
zip = "8"
# Checksum verification for self-update (hwp update) release archives — already
# pulled in via zip, so the dependency graph does not grow.
sha2 = "0.11"
# AES-128-ECB decryption for Hancom distribution documents (배포용문서/ViewText,
# GATE-01) — already pulled in via zip's AES-encrypted-archive support, so the
# dependency graph does not grow.
aes = "0.9.1"
getrandom = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
# `hwp serve` HTTP adapter (doc 22 §4 결정 기록) — 동기식 thread 모델이라 tokio를
# 들이지 않는다. 새로 붙는 하위 트리는 ascii/chunked_transfer/httpdate뿐이다.
tiny_http = "0.12"

# Rendering
tiny-skia = "0.12"
rustybuzz = "0.20"
fontdb = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
# WMF 텍스트(CP949 바이트 문자열) 디코딩 — 순수 Rust, HWP 비의존.
encoding_rs = "0.8"

# PDF backend
pdf-writer = "0.15"
subsetter = "0.2"

# Test-only
insta = { version = "1", features = ["json"] }
proptest = "1"
jsonschema = { version = "0.33", default-features = false }
base64 = "0.22.1"
cbc = "0.2.1"
hmac = "0.13.0"
pbkdf2 = "0.13.0"
sha1 = "0.11.0"
zeroize = "1.8.2"

[profile.release]
lto = "thin"

# Keep dev/test renders fast: these crates do the hot outline parsing and path filling, and
# unoptimized builds of them are ~100x slower on CFF-outline fonts (the CFF Noto CJK faces
# once made the ubuntu CI test step take 15 minutes). Release binaries are unaffected.
[profile.dev.package.ttf-parser]
opt-level = 2
[profile.dev.package.rustybuzz]
opt-level = 2
[profile.dev.package.tiny-skia]
opt-level = 2
[profile.dev.package.tiny-skia-path]
opt-level = 2

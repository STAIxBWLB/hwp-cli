[package]
name = "agent-hwp"
description = "HWP/HWPX document processing CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "ahwp"

[lib]
name = "hwp_cli"

[[bin]]
name = "ahwp"
path = "src/main.rs"

[dependencies]
hwp-model = { workspace = true }
hwp5 = { workspace = true }
hwpx = { workspace = true }
hwp-convert = { workspace = true }
hwp-render = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
# Runtime edit-ops-v1 validation at the `ahwp edit --ops` boundary (D-10).
jsonschema = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
# Structured-corpus PDF validation inflates FlateDecode streams; already used by hwp-render.
flate2 = { workspace = true }
regex = { workspace = true }
tiny-skia = { workspace = true }
image = { workspace = true }
quick-xml = { workspace = true }
libc = { workspace = true }
encoding_rs = { workspace = true }
resvg = { workspace = true }
zeroize = { workspace = true }
httparse = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
zip = { workspace = true }
# Test-only protected-bit fixture synthesis; already a direct dependency of hwp5.
cfb = { workspace = true }
aes = { workspace = true }
base64 = { workspace = true }
cbc = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
sha1 = { workspace = true }

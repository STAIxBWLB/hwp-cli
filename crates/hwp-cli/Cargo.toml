[package]
name = "hwp-cli"
description = "HWP/HWPX 문서 처리 CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hwp"
path = "src/main.rs"

[dependencies]
hwp-model = { workspace = true }
hwp5 = { workspace = true }
hwpx = { workspace = true }
hwp-convert = { workspace = true }
hwp-render = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
# 구조화 코퍼스 PDF 검증기가 FlateDecode 스트림을 인플레이트하는 데 사용.
# hwp-render가 이미 끌어오는 의존성이라 의존성 그래프는 커지지 않는다.
flate2 = { workspace = true }
regex = { workspace = true }
tiny-skia = { workspace = true }
image = { workspace = true }
quick-xml = { workspace = true }
libc = { workspace = true }
resvg = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
zip = { workspace = true }
jsonschema = { workspace = true }
# 보호 비트 픽스처 합성 전용 (테스트에서 FileHeader 속성 DWORD를 패치). 이미
# 워크스페이스 의존성이자 hwp5의 직접 의존성이라 트리에 새 코드가 추가되지 않고,
# dev 전용이라 출시 바이너리에는 들어가지 않는다.
cfb = { workspace = true }

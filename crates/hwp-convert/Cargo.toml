[package]
name = "hwp-convert"
description = "IR ↔ markdown/JSON 변환"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hwp-model = { workspace = true }
serde_json = { workspace = true }
pulldown-cmark = { workspace = true }
quick-xml = { workspace = true }
regex = { workspace = true }
resvg = { workspace = true }
image = { workspace = true }
zip = { workspace = true }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# Test-only: document_merge's general-graft test against the committed
# fixtures/samples/report-tables.hwpx sample reads a genuine hwpx package.
# hwp-convert's production code stays format-agnostic (hub-and-spoke,
# invariant 1) — this is a dev-dependency, not linked into the shipped binary.
hwpx = { workspace = true }

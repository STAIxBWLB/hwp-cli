name: Dependency policy

# cargo-deny (advisories, bans, licenses, sources; policy in deny.toml). It blocks releases
# only: release.yml calls this workflow as a prerequisite of create-release. It is not a pull
# request check, because a new advisory against an unchanged lockfile must not turn an
# unrelated PR red. It runs on a schedule (advisories appear without any commit), when the
# lockfile or the policy changes on main, on demand, and when release.yml calls it.
on:
  schedule:
    - cron: "17 21 * * 0" # Sundays 21:17 UTC = Mondays 06:17 KST (GitHub cron is UTC)
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - deny.toml
      - .github/workflows/deny.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pinned to a full commit SHA: this job is the release gate, and a mutable tag would let
      # a moved tag run unreviewed code with the release's context. Bump with the reviewed tag.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
          arguments: --locked

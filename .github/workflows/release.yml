name: Release

# Pushing a vX.Y.Z tag publishes platform `hwp` binaries to a GitHub Release (archive +
# sha256) only after (1) the tagged commit already has a green CI run — its own, or the green
# run of a merged PR head whose tree is identical (ci.yml deduplicates such main pushes, so
# the tagged commit can legitimately have no own check runs) — and (2) the tag
# matches the Cargo.toml version.
# Release flow (main is protected, so the version bump cannot be pushed to it directly):
# close the CHANGELOG section and run scripts/release.sh X.Y.Z on a branch, discard the tag
# it creates there (`git tag -d vX.Y.Z`), open a PR, squash merge it, then tag the merge
# commit once CI is green on main:  git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    # glob pattern (not regex) — matches multi-digit and prerelease tags (v10.2.3, v0.2.0-rc1).
    # Exact version verification is the verify-version job's job.
    tags: ["v*.*.*"]

# Tag releases run one at a time, so two update-formula runs cannot race on Formula/hwp.rb.
# GitHub keeps one pending run per group: a third tag pushed while one run is running and
# another is pending replaces the pending one; that cancelled tag is recovered by re-running
# its workflow (create-release is rerun-safe).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read # verify-ci reads the tagged commit's check runs
  actions: read # verify-ci reads the readiness run cited by the CHANGELOG

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pass gate: the tagged commit must already have a green CI run (ci.yml runs on every
  # main push, and release.sh always tags main HEAD). Re-running the whole matrix here
  # duplicated ~25 runner-minutes per release; reading the check-runs API gives the same
  # guarantee. ci.yml may deduplicate a main push whose tree a merged PR head already
  # verified, leaving the commit with no own check runs — the identical-tree fallback below
  # accepts that PR head's green runs, but ONLY when every gate job on the tagged commit is
  # absent or skipped (the dedup signature): a failed, cancelled or pending own job must
  # never be overridden by earlier PR evidence. The job names below must stay in sync with
  # ci.yml.
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The --as-tag gate asks whether the evaluated commit is an ancestor of the tag and what
          # changed between them; neither question is answerable in a shallow clone.
          fetch-depth: 0
      - name: Tagged commit has green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=("lint" "pdf-parity" "test (ubuntu-latest)" "test (macos-latest)" "test (windows-latest)")
          # Prints the five states for $1 and succeeds only if all are completed/success.
          check_green() {
            local sha="$1" runs state name failed=0
            runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?filter=latest&per_page=100")" || return 1
            for name in "${expected[@]}"; do
              state="$(jq -r --arg n "$name" \
                '[.check_runs[] | select(.name == $n)] | sort_by(.completed_at) | .[-1] | if . == null then "absent" else "\(.status)/\(.conclusion // "pending")" end' \
                <<<"$runs")"
              echo "$name: $state"
              [ "$state" = "completed/success" ] || failed=1
            done
            return "$failed"
          }
          runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100")"
          all_green=true
          fallback_ok=true
          for name in "${expected[@]}"; do
            state="$(jq -r --arg n "$name" \
              '[.check_runs[] | select(.name == $n)] | sort_by(.completed_at) | .[-1] | if . == null then "absent" else "\(.status)/\(.conclusion // "pending")" end' \
              <<<"$runs")"
            echo "$name: $state"
            case "$state" in
            completed/success)
              # A real own result exists. It counts toward the pass above, but the dedup
              # signature is all five absent/skipped, so a partial own result also
              # disqualifies the PR-head fallback.
              fallback_ok=false
              ;;
            absent|completed/skipped|completed/neutral)
              # The dedup signature: ci.yml's decision job skipped the matrix, so the
              # commit legitimately has no own runs — the PR-head fallback stays available.
              all_green=false
              ;;
            *)
              # An own job failed, was cancelled, or is still pending: refuse. Falling
              # back to the PR head here would let a release proceed on a failed tree.
              all_green=false
              fallback_ok=false
              ;;
            esac
          done
          if [ "$all_green" = "true" ]; then
            echo "CI evidence: own check runs"
            exit 0
          fi
          if [ "$fallback_ok" != "true" ]; then
            echo "::error::Tagged commit $GITHUB_SHA has no green CI. Let the CI workflow pass on main, then re-run this workflow."
            exit 1
          fi
          # Identical-tree fallback: a main commit deduplicated by ci.yml's decision job has
          # no own check runs (only absent/skipped, verified above); accept the merged PR
          # head's green runs when the trees match.
          pulls="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100")"
          pr="$(jq -c --arg sha "$GITHUB_SHA" \
            '[.[] | select(.merged_at != null and .merge_commit_sha == $sha)] | sort_by(.number) | last // empty' \
            <<<"$pulls")"
          if [ -n "$pr" ]; then
            pr_number="$(jq -r .number <<<"$pr")"
            head_sha="$(jq -r .head.sha <<<"$pr")"
            tag_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
            head_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq .tree.sha)"
            if [ "$tag_tree" = "$head_tree" ] && check_green "$head_sha"; then
              echo "CI evidence: PR #$pr_number head $head_sha validated identical tree $tag_tree"
              exit 0
            fi
          fi
          echo "::error::Tagged commit $GITHUB_SHA has no green CI and no identical-tree PR head with green CI. Let the CI workflow pass on main, then re-run this workflow."
          exit 1

      # Second half of the same gate: the release BODY must carry the marker-bounded
      # Verification block, and the release-readiness run it cites must be a successful run of
      # release-readiness.yml. A tag commit is never the commit that run evaluated - the release
      # commit and the squash merge both come after it - so `--as-tag` binds them by ancestry plus
      # a release-only delta instead of equality (#268). scripts/release.sh runs the same script in
      # its own mode before it tags, so a release still cannot acquire evidence on the way.
      - name: Tagged version cites a verified readiness run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-verification-block.sh "${GITHUB_REF_NAME#v}" "$GITHUB_SHA" --as-tag

  # Version gate — the tag must match the Cargo.toml [workspace.package] version.
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p&&/^version[[:space:]]*=/{sub(/^version[[:space:]]*=[[:space:]]*"/,"");sub(/".*/,"");print;exit}' Cargo.toml)
          echo "tag=$tag  Cargo.toml=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match Cargo.toml [workspace.package] version=$ver. Bump the version with scripts/release.sh before tagging."
            exit 1
          fi

  # Create the release shell once (notes come from the CHANGELOG section). Skipped if it
  # already exists (rerun-safe). Created as a draft: `releases/latest` ignores drafts, so
  # install.sh and `hwp update` cannot pick the release up until publish-release flips it,
  # which happens only after every asset gate has passed.
  create-release:
    needs: [verify-ci, verify-version]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release body is the version's CHANGELOG.md section (bilingual) verbatim.
          # The script fails when the section is missing, which forces a CHANGELOG update
          # before any release.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            bash scripts/release_notes.sh "$GITHUB_REF_NAME" > /tmp/release-notes.md
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md --verify-tag --draft
          fi

  # Build platform `hwp` binaries -> upload archives (tar.gz/zip) + sha256 to the release.
  upload-assets:
    needs: create-release
    timeout-minutes: 30
    strategy:
      fail-fast: false # one target's failure must not cancel the others
      matrix:
        include:
          # Cross-built against a glibc 2.17 baseline: a native ubuntu-24.04 build needs
          # GLIBC_2.39, which serverless runtimes do not have (Vercel and AWS Lambda run
          # Amazon Linux 2023 = glibc 2.34), so the asset was unusable there. The action
          # strips the `.2.17` suffix when naming the archive, so the published asset name
          # is unchanged — install.sh, update.rs, update_formula.sh and the formula all
          # keep matching it.
          - target: x86_64-unknown-linux-gnu.2.17
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          # Same treatment for arm64, which AgentCore requires. glibc's aarch64 port
          # starts at 2.17, so the same floor is both valid and the lowest meaningful one.
          - target: aarch64-unknown-linux-gnu.2.17
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Release binaries build on stable (latest optimizations); MSRV compatibility is
      # already guaranteed by CI, which builds and tests on the pinned MSRV toolchain.
      - uses: dtolnay/rust-toolchain@stable
      # Ahead of the action, whose own fallback is a bare `pip3 install` that PEP 668
      # rejects on ubuntu-24.04. The PyPI package depends on `ziglang`, so this also
      # provides zig — no separate toolchain step.
      - if: matrix.build-tool == 'cargo-zigbuild'
        run: pip3 install --break-system-packages cargo-zigbuild
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: hwp
          target: ${{ matrix.target }}
          # Empty for the native targets — the action then picks its own default.
          build-tool: ${{ matrix.build-tool }}
          archive: $bin-$tag-$target
          # The binary carries third-party code under its own notice (NOTICE: kordoc, MIT),
          # so the licenses travel with it. Next to the binary at the archive root, where
          # install.sh, `hwp update` and the Homebrew formula only pick up `hwp`.
          include: LICENSE-MIT,LICENSE-APACHE,NOTICE
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # claude.ai skill bundle: SKILL.md + bootstrap.sh + the Linux x86_64 binary in one zip.
  # Why the binary ships instead of a download script: the claude.ai sandbox network is
  # restricted to registries, so the binary cannot be fetched at runtime (bundling beats downloading).
  skill-bundle:
    needs: upload-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Assemble and upload hwp-skill-claude-web.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          # The Linux archive just published by upload-assets (naming: $bin-$tag-$target.tar.gz).
          gh release download "$GITHUB_REF_NAME" \
            --pattern "hwp-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" \
            --dir "$work" --clobber
          tar -xzf "$work/hwp-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" -C "$work"
          # The asset is already extracted here, so the serverless-compatibility gate is
          # free: it must run, and its glibc floor must stay at the cross-build baseline
          # (a native build would silently raise it back to the runner's glibc).
          "$work/hwp" --version
          floor=$(strings -a "$work/hwp" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "glibc floor: $floor"
          [ "$floor" = "GLIBC_2.17" ] || { echo "::error::glibc floor regressed ($floor) — the Linux asset no longer runs on Vercel/Lambda"; exit 1; }
          bundle="$work/bundle"
          mkdir -p "$bundle/bin"
          cp skills/hwp/SKILL.md "$bundle/SKILL.md"
          cp skills/hwp/claude-web/bootstrap.sh "$bundle/bootstrap.sh"
          cp "$work/hwp" "$bundle/bin/hwp"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "$bundle/"
          chmod +x "$bundle/bin/hwp" "$bundle/bootstrap.sh"
          (cd "$bundle" && zip -r "$work/hwp-skill-claude-web.zip" SKILL.md bootstrap.sh bin/hwp LICENSE-MIT LICENSE-APACHE NOTICE)
          (cd "$work" && sha256sum hwp-skill-claude-web.zip > hwp-skill-claude-web.zip.sha256)
          gh release upload "$GITHUB_REF_NAME" \
            "$work/hwp-skill-claude-web.zip" \
            "$work/hwp-skill-claude-web.zip.sha256" \
            --clobber

  # Everything is uploaded and gated — make the release public. Any earlier job failing
  # leaves the release a draft, so a broken or serverless-incompatible asset is never the
  # release install.sh and `hwp update` resolve to.
  publish-release:
    needs: skill-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # Homebrew formula (the repo itself is the tap): update version/sha256 from the freshly
  # uploaded assets. main is a protected branch, so the bot cannot push directly — open a PR
  # and merge it: squash auto-merge when possible, an immediate squash merge as fallback
  # (repos with no required checks refuse auto-merge on clean PRs). The release is valid
  # either way, and scripts/update_formula.sh X.Y.Z remains the local recovery path.
  update-formula:
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Check out main, not the tag — the formula change targets main.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Update formula and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          branch="brew/formula-v$ver"
          scripts/update_formula.sh "$ver"
          if git diff --quiet Formula/hwp.rb; then
            echo "no formula change — skipping PR"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/hwp.rb
          git commit -m "chore(brew): formula v$ver"
          # Give --force-with-lease its reference point on reruns: a fresh checkout only
          # fetches main, so an existing remote branch would be rejected as "stale info".
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            # The org may forbid Actions from creating PRs ("GitHub Actions is not
            # permitted to create or approve pull requests"). Degrade gracefully for
            # that specific rejection — the branch is already pushed, so a human opens
            # the PR with one click. Any other failure still fails the job.
            if ! err=$(gh pr create --base main --head "$branch" \
              --title "chore(brew): formula v$ver" \
              --body "Update the Homebrew formula version/sha256 from the $GITHUB_REF_NAME release assets. Opened by the release workflow because main is protected against direct bot pushes." 2>&1); then
              echo "$err"
              if grep -qi "not permitted to create or approve pull requests" <<<"$err"; then
                echo "::warning::PR creation blocked (org policy). Open it manually: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
                exit 0
              fi
              exit 1
            fi
          fi
          # Auto-merge first; repos with no required checks refuse auto-merge on a clean
          # PR ("Pull request is in clean status"), so fall back to merging immediately.
          if ! gh pr merge --auto --squash "$branch"; then
            gh pr merge --squash "$branch" \
              || echo "::warning::merge the formula PR manually: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
          fi

      # The step above used to end on a warning and exit 0 whether or not the formula actually
      # moved, so a release could finish green with `brew install hwp` still serving the previous
      # version and nothing failing. This repository IS the tap, so what Homebrew serves is
      # Formula/hwp.rb on main - read it back and require it to name the released version.
      # Auto-merge is asynchronous (it lands once the PR's checks settle), hence the wait rather
      # than a single read.
      - name: The tap serves the released version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            served="$(gh api "repos/$GITHUB_REPOSITORY/contents/Formula/hwp.rb?ref=main" \
              --jq '.content' | base64 -d \
              | sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' | head -1)"
            if [ "$served" = "$ver" ]; then
              echo "Formula/hwp.rb on main serves $served (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: main still serves '${served:-<unreadable>}', want '$ver'"
            sleep 10
          done
          echo "::error::the tap still serves '${served:-<unreadable>}' after the release of v$ver."
          echo "::error::brew install/upgrade hwp would hand users the previous version."
          echo "::error::merge the formula PR: https://github.com/$GITHUB_REPOSITORY/pulls"
          exit 1

name: Release

# Pushing a vX.Y.Z tag publishes archives only after its ci-ok aggregate succeeds (or
# an absent aggregate is backed by an identical-tree PR with all five heavy checks plus
# ci-ok successful), and the tag matches Cargo.toml. Deduplicated main pushes now report
# their own ci-ok; only their heavy jobs are skipped.
# Release flow (main is protected, so the version bump cannot be pushed to it directly):
# close the CHANGELOG section and run scripts/release.sh X.Y.Z on a branch, discard the tag
# it creates there (`git tag -d vX.Y.Z`), open a PR, squash merge it, then tag the merge
# commit once CI is green on main:  git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    # glob pattern (not regex) — matches multi-digit and prerelease tags (v10.2.3, v0.2.0-rc1).
    # Exact version verification is the verify-version job's job.
    tags: ["v*.*.*"]

# Tag releases run one at a time, so two update-formula runs cannot race on Formula/ahwp.rb.
# GitHub keeps one pending run per group: a third tag pushed while one run is running and
# another is pending replaces the pending one; that cancelled tag is recovered by re-running
# its workflow (create-release is rerun-safe).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read # verify-ci reads the tagged commit's check runs
  actions: read # verify-ci reads the readiness run cited by the CHANGELOG and polls CI runs

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pass gate: require the stable ci-ok aggregate, which covers every gating CI job
  # and the explicitly proved path/dedup skips. Skipped/neutral/failed/cancelled aggregates
  # refuse release. Legacy absent aggregates may use a merged identical-tree PR's ci-ok.
  #
  # A tag pushed right after the merge used to fail here because the tagged commit's CI was
  # still running (v1.2.0, #412). The gate now polls: while a CI workflow run for the commit is
  # unfinished, or any gate job is queued/in progress, it waits and re-reads, up to
  # CI_WAIT_DEADLINE seconds. Only settled states are judged against the ci-ok aggregate.
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # The --as-tag gate asks whether the evaluated commit is an ancestor of the tag and what
          # changed between them; neither question is answerable in a shallow clone.
          fetch-depth: 0
      - name: Tagged commit has green CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WAIT_DEADLINE: "2700" # seconds; inside the job's 60-minute timeout
        run: |
          set -euo pipefail
          expected=("ci-ok")
          fallback_expected=("lint" "pdf-parity" "test (ubuntu-latest)" "test (macos-latest)" "test (windows-latest)" "ci-ok")
          # PR fallback requires the full six-check proof, not a lightweight aggregate alone.
          check_green() {
            local sha="$1" runs state name failed=0
            runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?filter=latest&per_page=100")" || return 1
            for name in "${fallback_expected[@]}"; do
              state="$(jq -r --arg n "$name" \
                '[.check_runs[] | select(.name == $n)] | sort_by(.completed_at) | .[-1] | if . == null then "absent" else "\(.status)/\(.conclusion // "pending")" end' \
                <<<"$runs")"
              echo "$name: $state"
              [ "$state" = "completed/success" ] || failed=1
            done
            return "$failed"
          }
          # Poll until CI on the tagged commit has settled: no ci.yml run for the commit is
          # unfinished and no gate job is queued or in progress. The dedup case settles too
          # (decision and ci-ok finish while the heavy jobs stay intentionally skipped).
          deadline=$(( $(date +%s) + ${CI_WAIT_DEADLINE:-2700} ))
          while :; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100")"
            pending_jobs="$(jq -r --argjson names "$(printf '%s\n' "${expected[@]}" | jq -R . | jq -s .)" \
              '[.check_runs[] | select(.name as $n | $names | index($n)) | select(.status != "completed")] | length' <<<"$runs")"
            pending_wf="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
            if [ "$pending_jobs" = "0" ] && [ "$pending_wf" = "0" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI on $GITHUB_SHA is still running after the wait deadline. Re-run this workflow once it settles."
              exit 1
            fi
            echo "CI on $GITHUB_SHA not settled yet (pending gate jobs: $pending_jobs, unfinished CI runs: $pending_wf); waiting 30s"
            sleep 30
          done
          all_green=true
          fallback_ok=true
          for name in "${expected[@]}"; do
            state="$(jq -r --arg n "$name" \
              '[.check_runs[] | select(.name == $n)] | sort_by(.completed_at) | .[-1] | if . == null then "absent" else "\(.status)/\(.conclusion // "pending")" end' \
              <<<"$runs")"
            echo "$name: $state"
            case "$state" in
            completed/success)
              # A real own aggregate result disqualifies historical PR fallback.
              fallback_ok=false
              ;;
            absent)
              # Only legacy commits without ci-ok can use identical-tree PR evidence.
              # A skipped/neutral aggregate is unexpected and must never pass.
              all_green=false
              ;;
            *)
              # An own job failed, was cancelled, or is still pending: refuse. Falling
              # back to the PR head here would let a release proceed on a failed tree.
              all_green=false
              fallback_ok=false
              ;;
            esac
          done
          if [ "$all_green" = "true" ]; then
            echo "CI evidence: own check runs"
            exit 0
          fi
          if [ "$fallback_ok" != "true" ]; then
            echo "::error::Tagged commit $GITHUB_SHA has no green CI. Let the CI workflow pass on main, then re-run this workflow."
            exit 1
          fi
          # Legacy absent-aggregate fallback accepts only an identical-tree merged PR
          # whose five heavy checks and ci-ok succeeded. Lightweight runs publish their own ci-ok.
          pulls="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100")"
          pr="$(jq -c --arg sha "$GITHUB_SHA" \
            '[.[] | select(.merged_at != null and .merge_commit_sha == $sha)] | sort_by(.number) | last // empty' \
            <<<"$pulls")"
          if [ -n "$pr" ]; then
            pr_number="$(jq -r .number <<<"$pr")"
            head_sha="$(jq -r .head.sha <<<"$pr")"
            tag_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
            head_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq .tree.sha)"
            if [ "$tag_tree" = "$head_tree" ] && check_green "$head_sha"; then
              echo "CI evidence: PR #$pr_number head $head_sha validated identical tree $tag_tree"
              exit 0
            fi
          fi
          echo "::error::Tagged commit $GITHUB_SHA has no green CI and no identical-tree PR head with green CI. Let the CI workflow pass on main, then re-run this workflow."
          exit 1

      # Second half of the same gate: the release BODY must carry the marker-bounded
      # Verification block, and the release-readiness run it cites must be a successful run of
      # release-readiness.yml. A tag commit is never the commit that run evaluated - the release
      # commit and the squash merge both come after it - so `--as-tag` binds them by ancestry plus
      # a release-only delta instead of equality (#268). scripts/release.sh runs the same script in
      # its own mode before it tags, so a release still cannot acquire evidence on the way.
      - name: Tagged version cites a verified readiness run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-verification-block.sh "${GITHUB_REF_NAME#v}" "$GITHUB_SHA" --as-tag

  # Version gate — the tag must match the Cargo.toml [workspace.package] version.
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p&&/^version[[:space:]]*=/{sub(/^version[[:space:]]*=[[:space:]]*"/,"");sub(/".*/,"");print;exit}' Cargo.toml)
          echo "tag=$tag  Cargo.toml=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match Cargo.toml [workspace.package] version=$ver. Bump the version with scripts/release.sh before tagging."
            exit 1
          fi

  # Dependency policy (cargo-deny: advisories, bans, licenses, sources) is a release
  # prerequisite only; deny.yml is not a pull request check.
  deny:
    uses: ./.github/workflows/deny.yml
    permissions:
      contents: read

  # Create the release shell once (notes come from the CHANGELOG section). Skipped if it
  # already exists (rerun-safe). Created as a draft: `releases/latest` ignores drafts, so
  # install.sh and `hwp update` cannot pick the release up until publish-release flips it,
  # which happens only after every asset gate has passed.
  create-release:
    needs: [verify-ci, verify-version, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release body is the version's CHANGELOG.md section (bilingual) verbatim.
          # The script fails when the section is missing, which forces a CHANGELOG update
          # before any release.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            bash scripts/release_notes.sh "$GITHUB_REF_NAME" > /tmp/release-notes.md
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md --verify-tag --draft
          fi

  # Build platform `ahwp` binaries -> upload archives (tar.gz/zip) + sha256 to the release.
  # The asset name carries the command name (#510): `ahwp-<tag>-<target>`, with the legacy
  # `hwp-<tag>-<target>` names republished from the same bytes by `alias-assets` below.
  upload-assets:
    needs: create-release
    timeout-minutes: 30
    strategy:
      fail-fast: false # one target's failure must not cancel the others
      matrix:
        include:
          # Cross-built against a glibc 2.17 baseline: a native ubuntu-24.04 build needs
          # GLIBC_2.39, which serverless runtimes do not have (Vercel and AWS Lambda run
          # Amazon Linux 2023 = glibc 2.34), so the asset was unusable there. The action
          # strips the `.2.17` suffix when naming the archive, so the published asset name
          # is unchanged — install.sh, update.rs, update_formula.sh and the formula all
          # keep matching it.
          - target: x86_64-unknown-linux-gnu.2.17
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          # Same treatment for arm64, which AgentCore requires. glibc's aarch64 port
          # starts at 2.17, so the same floor is both valid and the lowest meaningful one.
          - target: aarch64-unknown-linux-gnu.2.17
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Release binaries build with the toolchain CI tested (rust-toolchain.toml, which
      # rustup honors for every cargo call in this checkout), not a floating @stable (#412).
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
      # Ahead of the action, whose own fallback is a bare `pip3 install` that PEP 668
      # rejects on ubuntu-24.04. Both versions are pinned (the ones v1.3.x shipped with), so
      # a new cargo-zigbuild or zig release cannot change a release build unannounced.
      - if: matrix.build-tool == 'cargo-zigbuild'
        run: pip3 install --break-system-packages cargo-zigbuild==0.23.4 ziglang==0.16.0
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          # The binary is `ahwp` since #510's T1; `alias-assets` adds the `hwp`
          # compatibility name to each archive afterwards, and the action packs what this
          # name builds. A tag whose tree still names the binary `hwp` fails here.
          bin: ahwp
          target: ${{ matrix.target }}
          # Empty for the native targets — the action then picks its own default.
          build-tool: ${{ matrix.build-tool }}
          # Build exactly the dependency set in Cargo.lock that CI tested.
          locked: true
          archive: $bin-$tag-$target
          # The binary carries third-party code under its own notice (NOTICE: kordoc, MIT),
          # so the licenses travel with it. Next to the binary at the archive root, where
          # install.sh, `ahwp update` and the Homebrew formula only pick up the executable.
          include: LICENSE-MIT,LICENSE-APACHE,NOTICE
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # #510's rename bridge: every archive also carries the legacy `hwp` command name, and through
  # 1.x the same bytes are published under the legacy `hwp-<tag>-<target>` asset name so an
  # already-installed 1.5 `hwp update` (which fetches that name) keeps upgrading.
  #
  # Why here instead of per-OS in upload-assets: the alias has to be inside the archive for
  # install.sh, the formula and `update` to see one layout, and upload-rust-binary-action packs
  # only what `bin:` built. Repacking once on one runner keeps that logic in one place instead of
  # a tar/zip branch in five matrix legs.
  #
  # The alias is a hard link on the Unix targets (one binary, two names) and a copy in the
  # Windows zip, where a link has no meaning. 2.0.0 drops both the alias and the legacy asset
  # name (issue #510, Phase 4); the major guard below is what retires them.
  alias-assets:
    needs: upload-assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Add the hwp name and republish the legacy asset names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="$GITHUB_REF_NAME"
          major="${tag#v}"
          major="${major%%.*}"
          work="$(pwd)/assets"
          mkdir -p "$work"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$work" \
            --pattern "ahwp-$tag-*.tar.gz" --pattern "ahwp-$tag-*.zip"
          cd "$work"

          # Both names in one archive, asserted from the archive itself rather than trusted.
          repack_tar() {
            local archive="$1" dir
            dir="repack-${archive%.tar.gz}"
            mkdir -p "$dir"
            tar -xzf "$archive" -C "$dir"
            [ -f "$dir/ahwp" ] || { echo "::error::$archive carries no ahwp"; return 1; }
            ln "$dir/ahwp" "$dir/hwp"
            mapfile -t entries < <(ls -A "$dir")
            tar -czf "$archive" -C "$dir" "${entries[@]}"
            # grep reads all of its input (`>/dev/null`, not -q): under pipefail an early
            # exit turns a match into a SIGPIPE failure (#368).
            tar -tzf "$archive" | grep -x 'ahwp' >/dev/null
            tar -tzf "$archive" | grep -x 'hwp' >/dev/null
          }

          repack_zip() {
            local archive="$1" dir absolute
            dir="repack-${archive%.zip}"
            absolute="$(pwd)/$archive"
            mkdir -p "$dir"
            unzip -q "$archive" -d "$dir"
            [ -f "$dir/ahwp.exe" ] || { echo "::error::$archive carries no ahwp.exe"; return 1; }
            cp -p "$dir/ahwp.exe" "$dir/hwp.exe"
            (cd "$dir" && zip -qr "$absolute" -- *)
            unzip -l "$archive" | grep 'ahwp\.exe' >/dev/null
            unzip -l "$archive" | grep 'hwp\.exe' >/dev/null
          }

          archives=(ahwp-"$tag"-*.tar.gz ahwp-"$tag"-*.zip)
          [ "${#archives[@]}" -gt 0 ] || { echo "::error::no ahwp archive was published for $tag"; exit 1; }
          for archive in "${archives[@]}"; do
            case "$archive" in
            *.tar.gz) repack_tar "$archive" ;;
            *.zip) repack_zip "$archive" ;;
            esac
            sha256sum "$archive" >"$archive.sha256"
            if [ "$major" = "1" ]; then
              legacy="${archive/ahwp-/hwp-}"
              cp "$archive" "$legacy"
              cmp "$archive" "$legacy"
              sha256sum "$legacy" >"$legacy.sha256"
            else
              echo "$archive: major $major, no legacy hwp- asset (#510 Phase 4)"
            fi
          done

          # --clobber replaces the archives upload-assets just published with the repacked
          # bytes, so a release never carries an archive without the compatibility name.
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            ahwp-"$tag"-*.tar.gz ahwp-"$tag"-*.tar.gz.sha256 \
            ahwp-"$tag"-*.zip ahwp-"$tag"-*.zip.sha256 \
            hwp-"$tag"-*.tar.gz hwp-"$tag"-*.tar.gz.sha256 \
            hwp-"$tag"-*.zip hwp-"$tag"-*.zip.sha256
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sort

  # claude.ai skill bundle: SKILL.md + bootstrap.sh + the Linux x86_64 binary in one zip.
  # Why the binary ships instead of a download script: the claude.ai sandbox network is
  # restricted to registries, so the binary cannot be fetched at runtime (bundling beats downloading).
  # The zip keeps its `hwp-skill` name and the skill keeps the name `hwp` (#510 leaves both
  # alone), but the binary it carries is `bin/ahwp`, which is what the skill's bootstrap and
  # templates call.
  skill-bundle:
    needs: alias-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Assemble and upload hwp-skill-claude-web.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          # The Linux archive just published (naming: $bin-$tag-$target.tar.gz), after
          # alias-assets repacked it.
          gh release download "$GITHUB_REF_NAME" \
            --pattern "ahwp-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" \
            --dir "$work" --clobber
          tar -xzf "$work/ahwp-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" -C "$work"
          # The asset is already extracted here, so the serverless-compatibility gate is
          # free: it must run, and its glibc floor must stay at the cross-build baseline
          # (a native build would silently raise it back to the runner's glibc).
          "$work/ahwp" --version
          floor=$(strings -a "$work/ahwp" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "glibc floor: $floor"
          [ "$floor" = "GLIBC_2.17" ] || { echo "::error::glibc floor regressed ($floor) — the Linux asset no longer runs on Vercel/Lambda"; exit 1; }
          bundle="$work/bundle"
          mkdir -p "$bundle/bin"
          cp skills/hwp/SKILL.md "$bundle/SKILL.md"
          cp skills/hwp/claude-web/bootstrap.sh "$bundle/bootstrap.sh"
          cp "$work/ahwp" "$bundle/bin/ahwp"
          cp LICENSE-MIT LICENSE-APACHE NOTICE "$bundle/"
          chmod +x "$bundle/bin/ahwp" "$bundle/bootstrap.sh"
          (cd "$bundle" && zip -r "$work/hwp-skill-claude-web.zip" SKILL.md bootstrap.sh bin/ahwp LICENSE-MIT LICENSE-APACHE NOTICE)
          (cd "$work" && sha256sum hwp-skill-claude-web.zip > hwp-skill-claude-web.zip.sha256)
          gh release upload "$GITHUB_REF_NAME" \
            "$work/hwp-skill-claude-web.zip" \
            "$work/hwp-skill-claude-web.zip.sha256" \
            --clobber

  # Everything is uploaded and gated — make the release public. Any earlier job failing
  # leaves the release a draft, so a broken or serverless-incompatible asset is never the
  # release install.sh and `hwp update` resolve to.
  # Build provenance for every archive and checksum file on the draft release (the platform
  # archives and the skill bundle), so `gh attestation verify <asset> -R STAIxBWLB/hwp-cli`
  # ties a download to this workflow run. Runs before publish, so a release is never public
  # without its attestations.
  attest:
    needs: skill-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Draft releases are listed only with push access; the release is still a draft here.
      # https://docs.github.com/en/rest/releases/releases#list-releases
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern '*.tar.gz' --pattern '*.zip' --pattern '*.sha256'
          ls -l assets
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            assets/*.tar.gz
            assets/*.zip
            assets/*.sha256

  publish-release:
    needs: [skill-bundle, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # Homebrew formula updates open a PR and wait for its exact-head ci-ok before enabling
  # squash auto-merge. GitHub's clean-status refusal can use a checked head-matched merge
  # after a fresh PR seal; every other error refuses. If automation cannot pass the gate,
  # inspect CI and merge the formula PR manually after its checks pass.
  update-formula:
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write # explicitly dispatch CI for the GITHUB_TOKEN-created formula PR
    steps:
      # Check out main, not the tag — the formula change targets main.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Update formula and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          branch="brew/formula-v$ver"
          scripts/update_formula.sh "$ver"
          if git diff --quiet Formula/ahwp.rb; then
            echo "no formula change — skipping PR"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/ahwp.rb
          git commit -m "chore(brew): formula v$ver"
          # Give --force-with-lease its reference point on reruns: a fresh checkout only
          # fetches main, so an existing remote branch would be rejected as "stale info".
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            # The org may forbid Actions from creating PRs ("GitHub Actions is not
            # permitted to create or approve pull requests"). Degrade gracefully for
            # that specific rejection — the branch is already pushed, so a human opens
            # the PR with one click. Any other failure still fails the job.
            if ! err=$(gh pr create --base main --head "$branch" \
              --title "chore(brew): formula v$ver" \
              --body "Update the Homebrew formula version/sha256 from the $GITHUB_REF_NAME release assets. Opened by the release workflow because main is protected against direct bot pushes." 2>&1); then
              echo "$err"
              if grep -qi "not permitted to create or approve pull requests" <<<"$err"; then
                echo "::warning::PR creation blocked (org policy). Open it manually: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
                exit 0
              fi
              exit 1
            fi
          fi
          python3 scripts/ci_gate.py formula --repo "$GITHUB_REPOSITORY" \
            --branch "$branch" --head "$(git rev-parse HEAD)"

      # The step above used to end on a warning and exit 0 whether or not the formula actually
      # moved, so a release could finish green with `brew install hwp` still serving the previous
      # version and nothing failing. This repository IS the tap, so what Homebrew serves is
      # Formula/ahwp.rb on main - read it back and require it to name the released version.
      # Auto-merge is asynchronous (it lands once the PR's checks settle), hence the wait rather
      # than a single read.
      - name: The tap serves the released version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            served="$(gh api "repos/$GITHUB_REPOSITORY/contents/Formula/ahwp.rb?ref=main" \
              --jq '.content' | base64 -d \
              | sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' | head -1)"
            if [ "$served" = "$ver" ]; then
              echo "Formula/ahwp.rb on main serves $served (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: main still serves '${served:-<unreadable>}', want '$ver'"
            sleep 10
          done
          echo "::error::the tap still serves '${served:-<unreadable>}' after the release of v$ver."
          echo "::error::brew install/upgrade ahwp would hand users the previous version."
          echo "::error::merge the formula PR: https://github.com/$GITHUB_REPOSITORY/pulls"
          exit 1

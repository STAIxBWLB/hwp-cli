name: Release

# vX.Y.Z 태그를 푸시하면: (1) 테스트 통과 (2) 태그↔Cargo.toml 버전 일치 를 확인한
# 뒤에만, 플랫폼별 `hwp` 바이너리를 빌드해 GitHub Release(아카이브 + sha256)로 게시한다.
# 릴리스 절차: scripts/release.sh X.Y.Z  →  git push origin main && git push origin vX.Y.Z
on:
  push:
    # glob 패턴(정규식 아님) — 멀티자리/프리릴리스 모두 매칭(v10.2.3, v0.2.0-rc1).
    # 정확한 버전 검증은 아래 verify-version 잡이 담당한다.
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 테스트 통과 게이트 — ci.yml 의 fmt/clippy/test 잡을 그대로 재사용(단일 진실).
  test:
    uses: ./.github/workflows/ci.yml

  # 버전 관리 게이트 — 태그가 Cargo.toml [workspace.package] version 과 일치해야 릴리스.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 태그 ↔ Cargo.toml 버전 일치 확인
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p&&/^version[[:space:]]*=/{sub(/^version[[:space:]]*=[[:space:]]*"/,"");sub(/".*/,"");print;exit}' Cargo.toml)
          echo "tag=$tag  Cargo.toml=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::태그 v$tag 가 Cargo.toml [workspace.package] version=$ver 와 불일치. scripts/release.sh 로 버전 bump 후 태깅하세요."
            exit 1
          fi

  # 릴리스 셸 생성(커밋/PR 기반 자동 노트) — 한 번만. 이미 있으면 건너뜀(재실행 안전).
  create-release:
    needs: [test, verify-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 릴리스 본문은 CHANGELOG.md의 해당 버전 절(한/영 병기)을 그대로 쓴다.
          # 절이 없으면 스크립트가 실패하므로, 릴리스 전에 CHANGELOG 갱신을 강제한다.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            bash scripts/release_notes.sh "$GITHUB_REF_NAME" > /tmp/release-notes.md
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md --verify-tag
          fi

  # 플랫폼별 `hwp` 바이너리 빌드 → 아카이브(tar.gz/zip) + sha256 을 릴리스에 업로드.
  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false # 한 타깃 실패가 다른 타깃을 취소하지 않게
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 릴리스 바이너리는 stable 로 빌드(최신 최적화). MSRV 호환은 test 잡이 이미 보장.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: hwp
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # claude.ai 스킬 번들: SKILL.md + bootstrap.sh + Linux x86_64 바이너리를 한 zip으로.
  # 다운로드 스크립트 대신 바이너리를 싣는 이유: claude.ai 샌드박스 네트워크는 레지스트리로
  # 제한되어 런타임에 바이너리를 받을 수 없기 때문(번들링이 다운로드를 이긴다).
  skill-bundle:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hwp-skill-claude-web.zip 조립 + 업로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          # 방금 upload-assets 가 올린 리눅스 아카이브(이름 규칙: $bin-$tag-$target.tar.gz).
          gh release download "$GITHUB_REF_NAME" \
            --pattern "hwp-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" \
            --dir "$work" --clobber
          tar -xzf "$work/hwp-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" -C "$work"
          bundle="$work/bundle"
          mkdir -p "$bundle/bin"
          cp skills/hwp/SKILL.md "$bundle/SKILL.md"
          cp skills/hwp/claude-web/bootstrap.sh "$bundle/bootstrap.sh"
          cp "$work/hwp" "$bundle/bin/hwp"
          chmod +x "$bundle/bin/hwp" "$bundle/bootstrap.sh"
          (cd "$bundle" && zip -r "$work/hwp-skill-claude-web.zip" SKILL.md bootstrap.sh bin/hwp)
          (cd "$work" && sha256sum hwp-skill-claude-web.zip > hwp-skill-claude-web.zip.sha256)
          gh release upload "$GITHUB_REF_NAME" \
            "$work/hwp-skill-claude-web.zip" \
            "$work/hwp-skill-claude-web.zip.sha256" \
            --clobber

  # Homebrew formula(저장소 자체가 tap) 의 version/sha256 을 방금 올라온 자산 기준으로
  # 갱신해 main 에 커밋한다. 자산이 다 올라온 뒤라야 체크섬을 받을 수 있어 마지막 잡이다.
  # 실패해도 릴리스 자체는 유효하며, 로컬에서 scripts/update_formula.sh X.Y.Z 로 복구한다.
  update-formula:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      # 태그가 아니라 main 을 체크아웃한다 — 커밋 대상이 main 이기 때문.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: formula 갱신 + 커밋
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          scripts/update_formula.sh "$ver"
          if git diff --quiet Formula/hwp.rb; then
            echo "formula 변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/hwp.rb
          git commit -m "정리(brew): formula v$ver"
          git push origin HEAD:main

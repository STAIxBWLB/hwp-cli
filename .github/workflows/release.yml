name: Release

# Pushing a vX.Y.Z tag publishes platform `hwp` binaries to a GitHub Release (archive +
# sha256) only after (1) the tagged commit already has a green CI run and (2) the tag
# matches the Cargo.toml version.
# Release flow: scripts/release.sh X.Y.Z  ->  git push origin main && git push origin vX.Y.Z
on:
  push:
    # glob pattern (not regex) — matches multi-digit and prerelease tags (v10.2.3, v0.2.0-rc1).
    # Exact version verification is the verify-version job's job.
    tags: ["v*.*.*"]

permissions:
  contents: write
  pull-requests: write
  checks: read # verify-ci reads the tagged commit's check runs

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pass gate: the tagged commit must already have a green CI run (ci.yml runs on every
  # main push, and release.sh always tags main HEAD). Re-running the whole matrix here
  # duplicated ~25 runner-minutes per release; reading the check-runs API gives the same
  # guarantee. The job names below must stay in sync with ci.yml.
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Tagged commit has green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=("lint" "test (ubuntu-latest)" "test (macos-latest)" "test (windows-latest)")
          runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100")"
          failed=0
          for name in "${expected[@]}"; do
            state="$(jq -r --arg n "$name" \
              '[.check_runs[] | select(.name == $n)] | sort_by(.completed_at) | .[-1] | if . == null then "absent" else "\(.status)/\(.conclusion // "pending")" end' \
              <<<"$runs")"
            echo "$name: $state"
            [ "$state" = "completed/success" ] || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Tagged commit $GITHUB_SHA has no green CI. Let the CI workflow pass on main, then re-run this workflow."
            exit 1
          fi

  # Version gate — the tag must match the Cargo.toml [workspace.package] version.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p&&/^version[[:space:]]*=/{sub(/^version[[:space:]]*=[[:space:]]*"/,"");sub(/".*/,"");print;exit}' Cargo.toml)
          echo "tag=$tag  Cargo.toml=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match Cargo.toml [workspace.package] version=$ver. Bump the version with scripts/release.sh before tagging."
            exit 1
          fi

  # Create the release shell once (notes come from the CHANGELOG section). Skipped if it
  # already exists (rerun-safe).
  create-release:
    needs: [verify-ci, verify-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release body is the version's CHANGELOG.md section (bilingual) verbatim.
          # The script fails when the section is missing, which forces a CHANGELOG update
          # before any release.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            bash scripts/release_notes.sh "$GITHUB_REF_NAME" > /tmp/release-notes.md
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md --verify-tag
          fi

  # Build platform `hwp` binaries -> upload archives (tar.gz/zip) + sha256 to the release.
  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false # one target's failure must not cancel the others
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Release binaries build on stable (latest optimizations); MSRV compatibility is
      # already guaranteed by CI, which builds and tests on the pinned MSRV toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: hwp
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # claude.ai skill bundle: SKILL.md + bootstrap.sh + the Linux x86_64 binary in one zip.
  # Why the binary ships instead of a download script: the claude.ai sandbox network is
  # restricted to registries, so the binary cannot be fetched at runtime (bundling beats downloading).
  skill-bundle:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and upload hwp-skill-claude-web.zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          # The Linux archive just published by upload-assets (naming: $bin-$tag-$target.tar.gz).
          gh release download "$GITHUB_REF_NAME" \
            --pattern "hwp-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" \
            --dir "$work" --clobber
          tar -xzf "$work/hwp-$GITHUB_REF_NAME-x86_64-unknown-linux-gnu.tar.gz" -C "$work"
          bundle="$work/bundle"
          mkdir -p "$bundle/bin"
          cp skills/hwp/SKILL.md "$bundle/SKILL.md"
          cp skills/hwp/claude-web/bootstrap.sh "$bundle/bootstrap.sh"
          cp "$work/hwp" "$bundle/bin/hwp"
          chmod +x "$bundle/bin/hwp" "$bundle/bootstrap.sh"
          (cd "$bundle" && zip -r "$work/hwp-skill-claude-web.zip" SKILL.md bootstrap.sh bin/hwp)
          (cd "$work" && sha256sum hwp-skill-claude-web.zip > hwp-skill-claude-web.zip.sha256)
          gh release upload "$GITHUB_REF_NAME" \
            "$work/hwp-skill-claude-web.zip" \
            "$work/hwp-skill-claude-web.zip.sha256" \
            --clobber

  # Homebrew formula (the repo itself is the tap): update version/sha256 from the freshly
  # uploaded assets. main is a protected branch, so the bot cannot push directly — open a PR
  # and merge it: squash auto-merge when possible, an immediate squash merge as fallback
  # (repos with no required checks refuse auto-merge on clean PRs). The release is valid
  # either way, and scripts/update_formula.sh X.Y.Z remains the local recovery path.
  update-formula:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      # Check out main, not the tag — the formula change targets main.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update formula and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          branch="brew/formula-v$ver"
          scripts/update_formula.sh "$ver"
          if git diff --quiet Formula/hwp.rb; then
            echo "no formula change — skipping PR"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/hwp.rb
          git commit -m "chore(brew): formula v$ver"
          # Give --force-with-lease its reference point on reruns: a fresh checkout only
          # fetches main, so an existing remote branch would be rejected as "stale info".
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            # The org may forbid Actions from creating PRs ("GitHub Actions is not
            # permitted to create or approve pull requests"). Degrade gracefully for
            # that specific rejection — the branch is already pushed, so a human opens
            # the PR with one click. Any other failure still fails the job.
            if ! err=$(gh pr create --base main --head "$branch" \
              --title "chore(brew): formula v$ver" \
              --body "Update the Homebrew formula version/sha256 from the $GITHUB_REF_NAME release assets. Opened by the release workflow because main is protected against direct bot pushes." 2>&1); then
              echo "$err"
              if grep -qi "not permitted to create or approve pull requests" <<<"$err"; then
                echo "::warning::PR creation blocked (org policy). Open it manually: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
                exit 0
              fi
              exit 1
            fi
          fi
          # Auto-merge first; repos with no required checks refuse auto-merge on a clean
          # PR ("Pull request is in clean status"), so fall back to merging immediately.
          if ! gh pr merge --auto --squash "$branch"; then
            gh pr merge --squash "$branch" \
              || echo "::warning::merge the formula PR manually: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
          fi

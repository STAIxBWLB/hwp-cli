name: CI

# Path filter: documentation-only and formula-only changes skip CI entirely — no Rust
# input changes, so fmt/clippy/test outcomes cannot change. Markdown that IS a build, test or
# gate input is re-included: skills/hwp/SKILL.md (include_str! into the binary),
# docs/manual/** (cli-reference{,.ko}.md are compared byte-for-byte by tests/cli_reference.rs,
# and the whole directory is scanned by check-claims.sh and check-doc-surface.sh), README{,.ko}.md,
# CHANGELOG.md, skills/hwp/SKILL.ko.md and scripts/** — every path those two gates read. A file
# a gate scans but the filter excludes is a gate that never sees the change that breaks it.
# The same list must be kept identical under push and pull_request (GitHub Actions does not
# support YAML anchors).
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "!Formula/**"
      - "README.md"
      - "README.ko.md"
      - "CHANGELOG.md"
      - "docs/manual/**"
      - "skills/hwp/SKILL.md"
      - "skills/hwp/SKILL.ko.md"
      - "scripts/**"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!Formula/**"
      - "README.md"
      - "README.ko.md"
      - "CHANGELOG.md"
      - "docs/manual/**"
      - "skills/hwp/SKILL.md"
      - "skills/hwp/SKILL.ko.md"
      - "scripts/**"

env:
  CARGO_TERM_COLOR: always

# A new push on the same branch cancels the previous run (less waste, less latency).
# main is never cancelled — per-commit CI signal on consecutive merges is the bisect basis
# (and the release gate reads it via the check-runs API).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Gate layout: platform-independent checks run ONCE in `lint`; the 3-OS matrix in `test`
# runs only cargo test; the fixed Ubuntu PDF-parity job runs the committed public oracle.
# Same command set as scripts/check.sh (local mirror) plus the structured-corpus and public
# parity gates — keep them in sync or "local green, CI red" drift comes back.
jobs:
  lint:
    name: lint
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # MSRV pin (Cargo.toml rust-version): keeps rustfmt/clippy results deterministic
      # (floating stable lets previously-passing code suddenly fail on version drift) and
      # proves the declared minimum supported version actually builds.
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The checks are independent: run all of them even after a failure so every result
      # is reported in one run (fewer debug round-trips).
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: PDF parity runner tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest tools/test_pdf_parity.py
      # Fonts are not committed; the script fetches them from upstream and verifies
      # manifest hashes.
      - name: Structured document corpus (pinned OFL fonts, offline cargo)
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-structured-corpus.sh
      # The doc-surface gate compares the documented tool count against a live `hwp mcp`
      # tools/list session, so it needs a runnable binary; clippy only type-checks.
      - name: Build hwp (the doc-surface gate drives the real MCP server)
        if: ${{ !cancelled() }}
        run: cargo build --locked -p hwp-cli
      # The release-copy gates, same files scripts/check.sh runs locally. Separate steps so a
      # failure in one still reports the others.
      - name: Release copy claim lint
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-claims.sh
      - name: Release copy claim lint fixtures
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-claims.sh --self-test
      - name: Documentation surface (tool count, skill coverage)
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-doc-surface.sh
      - name: Documentation surface fixtures
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-doc-surface.sh --self-test

  pdf-parity:
    name: pdf-parity
    timeout-minutes: 30
    # The manifest pins the Poppler binary, so do not use ubuntu-latest here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Same hung-mirror bound as the test job's font install: an unbounded
      # apt-get here ate the whole 30-minute job budget on #117's own run,
      # reporting "cancelled" without the oracle having run at all.
      - name: Install pinned Poppler tools
        shell: bash
        # Worst case is 3 x (120s update + 120s install) + 2 x 10s sleep, ~12.3 min;
        # with the mirror pinned and apt-level timeouts the normal case is seconds.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # The runner's azure.archive.ubuntu.com mirror intermittently accepts the
          # connection and then stalls: on #119 three 90s-bounded attempts each died
          # inside the mirror's Ign/retry loop while apt's own fallback to
          # archive.ubuntu.com was still in progress. Hosted 24.04 runners select
          # repositories through mirror+file:/etc/apt/apt-mirrors.txt with the azure
          # mirror first, so pin the official archive THERE (the .sources/sed line
          # below is belt-and-braces for runners without the mirrorlist); apt's short
          # per-request timeouts make any remaining dead mirror cost seconds, and the
          # retry loop stays as backstop.
          echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt_get="sudo apt-get -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=1"
          installed=0
          for attempt in 1 2 3; do
            if timeout 120 $apt_get update && timeout 120 $apt_get install --no-install-recommends -y poppler-utils; then
              installed=1
              break
            fi
            echo "poppler install attempt ${attempt} failed or timed out; retrying" >&2
            sleep 10
          done
          if [ "$installed" != 1 ]; then
            echo "poppler-utils could not be installed after 3 attempts" >&2
            exit 1
          fi
          expected="$(python3 -c 'import json; print(json.load(open("fixtures/pdf-parity/public/manifest.json", encoding="utf-8"))["pins"]["poppler_version"])')"
          actual="$(pdfinfo -v 2>&1 | sed -n '1p')"
          echo "pdfinfo: $actual"
          test "$actual" = "$expected"
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Fetch exact OFL fonts
        shell: bash
        run: bash scripts/fetch-pdf-parity-fonts.sh
      - name: Build hwp
        run: cargo build --locked -p hwp-cli
      - name: Public PDF parity oracle
        shell: bash
        env:
          HWP_FONT_DIR: fixtures/pdf-parity/fonts
        run: bash scripts/pdf-parity.sh run --oracle-dir fixtures/pdf-parity/public/oracle
      - name: Upload numeric parity scorecards
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-parity-scoreboard
          path: fixtures/pdf-parity/public/scoreboard/
          if-no-files-found: error
          retention-days: 7

  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # All three are required gates: ubuntu (CI baseline) + macOS (owner's main
          # platform) + windows (MSVC build/tests, and the release binaries come from here).
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Render smoke tests need a system Korean font. fonts-nanum ships glyf-outline TTFs;
      # the CFF-based fonts-noto-cjk made debug-build outline extraction ~100x slower
      # (that alone was a 15-minute ubuntu test step).
      # Bounded and retried: a hung apt mirror used to consume the job's whole
      # 30-minute budget in this one step, which cancelled the job before the
      # toolchain, the cache and the Test step had run at all - so ubuntu reported
      # a failure without a single test having executed. A normal install takes
      # well under a minute; three bounded attempts fail fast and recover from a
      # transient mirror, and the step still fails loudly if fonts genuinely
      # cannot be installed (the render smoke tests need them).
      - name: Install Korean fonts (for rendering tests)
        if: runner.os == 'Linux'
        # Must exceed the retry loop's worst case (3 x (120s update + 120s install)
        # + 2 x 10s sleep, ~12.3 min); a smaller budget can cut the last retry short.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Per-attempt `timeout` matters: the failure mode seen twice was a HANG,
          # not a non-zero exit. Without it the first attempt never returns, the
          # step-level timeout kills the whole step, and the retries never run.
          # The runner's azure.archive.ubuntu.com mirror intermittently accepts and
          # then stalls (#119). Hosted 24.04 runners select repositories through
          # mirror+file:/etc/apt/apt-mirrors.txt with the azure mirror first, so pin
          # the official archive THERE (the .sources sed is belt-and-braces for
          # runners without the mirrorlist), and cap apt's own per-request waits so
          # any remaining dead mirror costs seconds, not the attempt.
          echo "https://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          apt_get="sudo apt-get -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=1"
          for attempt in 1 2 3; do
            if timeout 120 $apt_get update && timeout 120 $apt_get install -y fonts-nanum; then
              exit 0
            fi
            echo "font install attempt ${attempt} failed or timed out; retrying" >&2
            sleep 10
          done
          echo "fonts-nanum could not be installed after 3 attempts" >&2
          exit 1
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

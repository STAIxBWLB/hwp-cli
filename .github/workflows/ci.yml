name: CI

# Always publish ci-ok, including documentation/formula-only PRs. The decision job applies
# path policy to immutable event trees. Bundled skills/corpus always require full gates;
# unrelated docs/formula-only runs remain free of Rust builds.
on:
  # Ordinary workflow_dispatch is full: docs/formula-only main commits need it before readiness.
  workflow_dispatch:
    inputs:
      formula_pr:
        description: "Release-only formula PR number (omit for ordinary full CI)"
        type: string
        required: false
        default: ""
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A new push on the same branch cancels the previous run (less waste, less latency).
# main is never cancelled — per-commit CI signal on consecutive merges is the bisect basis
# (and the release gate reads it via the check-runs API). A main push whose tree a merged PR
# head already verified runs only `decision` and `ci-ok`: the deduplicated commit borrows
# the identical tree's PR signal, so the bisect basis is preserved in substance.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Preserve the identical-tree proof for main pushes. The prior five checks and ci-ok
  # must all succeed on the PR head. API failures run the full matrix, never silently skip.
  # Ordinary workflow_dispatch remains full for release-readiness; formula dispatch verifies
  # an open same-repository PR, its exact head and a Formula-only immutable diff.
  decision:
    name: decision
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      run_full: ${{ steps.dedupe.outputs.run_full }}
      skip_kind: ${{ steps.dedupe.outputs.skip_kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Deduplicate an already verified main tree
        id: dedupe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_full=true
          skip_kind=none
          path_kind="$(python3 scripts/ci_gate.py paths)"
          reason="this event requires full validation"
          if [ "$path_kind" != "full" ]; then
            run_full=false
            skip_kind="$path_kind"
            reason="immutable changed paths require no Rust gates ($path_kind)"
          fi
          expected=("lint" "pdf-parity" "test (ubuntu-latest)" "test (macos-latest)" "test (windows-latest)" "ci-ok")

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$run_full" = "true" ]; then
            reason="no merged PR with an already verified identical tree was found"

            if ! pulls=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100"); then
              echo "::warning::Could not resolve associated pull requests; running full CI."
            else
              if ! pr=$(jq -c --arg sha "$GITHUB_SHA" \
                '[.[] | select(.merged_at != null and .merge_commit_sha == $sha)] | sort_by(.number) | last // empty' \
                <<<"$pulls"); then
                echo "::warning::Could not parse associated pull requests; running full CI."
                pr=""
              fi

              if [ -n "$pr" ]; then
                if pr_number=$(jq -er .number <<<"$pr") \
                  && head_sha=$(jq -er .head.sha <<<"$pr") \
                  && push_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha) \
                  && head_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq .tree.sha) \
                  && runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?filter=latest&per_page=100"); then
                  if [ "$push_tree" != "$head_tree" ]; then
                    reason="the merged tree differs from PR #$pr_number head $head_sha"
                  else
                    all_green=true
                    for name in "${expected[@]}"; do
                      if ! state="$(jq -r --arg n "$name" \
                        '[.check_runs[] | select(.name == $n)] | sort_by(.completed_at) | .[-1] | if . == null then "absent" else "\(.status)/\(.conclusion // "pending")" end' \
                        <<<"$runs")"; then
                        echo "::warning::Could not parse PR gate check states; running full CI."
                        all_green=false
                        break
                      fi
                      echo "$name: $state"
                      [ "$state" = "completed/success" ] || all_green=false
                    done
                    if [ "$all_green" = "true" ]; then
                      run_full=false
                      skip_kind=dedupe
                      reason="PR #$pr_number head $head_sha validated the identical tree $push_tree"
                    else
                      reason="the gate check runs on PR #$pr_number head $head_sha are not all green"
                    fi
                  fi
                else
                  echo "::warning::Could not verify the associated PR tree and check runs; running full CI."
                fi
              fi
            fi
          fi

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "skip_kind=$skip_kind" >> "$GITHUB_OUTPUT"
          echo "CI decision: $reason"
          {
            if [ "$run_full" = "false" ]; then
              echo "### CI lightweight run"
              echo "$reason. The full matrix is intentionally skipped; ci-ok validates this decision."
            else
              echo "### CI full run"
              echo "$reason."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Gate layout: platform-independent checks run ONCE in `lint`; the 3-OS matrix in `test`
  # runs only cargo test; the fixed Ubuntu PDF-parity job runs the committed public oracle.
  # Same command set as scripts/check.sh (local mirror) plus the structured-corpus and public
  # parity gates — keep them in sync or "local green, CI red" drift comes back.
  lint:
    name: lint
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # MSRV pin (Cargo.toml rust-version): keeps rustfmt/clippy results deterministic
      # (floating stable lets previously-passing code suddenly fail on version drift) and
      # proves the declared minimum supported version actually builds.
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The checks are independent: run all of them even after a failure so every result
      # is reported in one run (fewer debug round-trips).
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: PDF parity runner tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest tools/test_pdf_parity.py
      # Fonts are not committed; the script fetches them from upstream and verifies
      # manifest hashes. The cache is keyed on the manifest and keeps the hash-named font
      # bytes, so a warm run needs no network (#412); the script re-verifies every cached file
      # against the manifest hash before using it.
      - name: Restore corpus font cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corpus-font-cache
          key: corpus-fonts-${{ hashFiles('corpus/structured-v1/manifest.json') }}
      - name: Structured document corpus (pinned OFL fonts, offline cargo)
        if: ${{ !cancelled() }}
        shell: bash
        # Covers the download budget scripts/fetch-corpus-fonts.sh documents: 3 targets (font,
        # license, metadata) at (150 s retry window + 120 s last attempt) = 13.5 min worst case,
        # then the offline cargo build and corpus run (88 s of the whole step with a warm Rust
        # cache). Only a cold font cache pays the download part. Kept under the job's 30 minutes.
        timeout-minutes: 22
        env:
          HWP_CORPUS_FONT_CACHE: ${{ runner.temp }}/corpus-font-cache
        run: bash scripts/check-structured-corpus.sh
      # AGENTS.md invariant 1 as a gate: hwp-convert and hwp-render must stay off each
      # other's normal dependency graph, which is the whole reason the segment id rule is
      # duplicated rather than shared.
      - name: Crate edges (hub-and-spoke invariant)
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-crate-edges.sh
      - name: Crate edges self-test
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-crate-edges.sh --self-test
      # The doc-surface gate compares the documented tool count against a live `hwp mcp`
      # tools/list session, so it needs a runnable binary; clippy only type-checks.
      - name: Build hwp (the doc-surface gate drives the real MCP server)
        if: ${{ !cancelled() }}
        run: cargo build --locked -p hwp-cli
      # Stubbed: exercises the release gate's refusals and publish protocol, not
      # real HWP bytes, so it needs no release build. Its font-manifest check runs
      # the debug binary's certify, so it follows the build above.
      - name: Hancom regression gate self test
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/tests/hancom-regression.sh
      # The release-copy gates, same files scripts/check.sh runs locally. Separate steps so a
      # failure in one still reports the others.
      - name: Release copy claim lint
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-claims.sh
      - name: Release copy claim lint fixtures
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-claims.sh --self-test
      - name: Documentation surface (tool count, skill coverage)
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-doc-surface.sh
      - name: Documentation surface fixtures
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-doc-surface.sh --self-test
      - name: Verification block fixtures
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/release_verification_block.sh --self-test
      # Runs the readiness workflow's own steps against fixtures: the trust policy, the gate
      # entries the record is assembled from, and the release binding that reads it.
      - name: Release readiness workflow fixtures
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/tests/release-readiness-selfcheck.sh
      # #275: proves the fixture-skip tally moves (absent path -> one line, present -> none,
      # HWP_REQUIRE_FIXTURES=1 -> failure), and that the invariant-2 gate's skip is counted here,
      # where fixtures/hwp5 is absent by the data policy.
      - name: Fixture skip accounting self test
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/tests/fixture-skip-accounting.sh
      # #412: the shared apt installer used by the pdf-parity and test jobs decides between the
      # cached .deb files and the bounded network fallback; this proves both with stubbed apt.
      - name: CI apt installer self test
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/tests/ci-apt-install.sh
      # A step limit shorter than the download retry budget it wraps would cancel a slow but
      # recoverable download; this reads both from the files and fails when one stops covering
      # the other.
      - name: CI download budgets self test
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/tests/ci-download-budgets.sh

  pdf-parity:
    name: pdf-parity
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    timeout-minutes: 30
    # The manifest pins the Poppler binary, so do not use ubuntu-latest here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Same hung-mirror bound as the test job's font install: an unbounded
      # apt-get here ate the whole 30-minute job budget on #117's own run,
      # reporting "cancelled" without the oracle having run at all.
      - name: Identify the runner image (cache key)
        id: image
        shell: bash
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      # The .deb files of the pinned Poppler are cached per runner image. A warm run installs
      # them with downloads forbidden, so a stalled apt mirror cannot fail the PR; a cold or
      # stale cache falls back to the bounded mirror install (scripts/ci-apt-install.sh).
      - name: Restore Poppler package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-poppler
          key: apt-poppler-${{ steps.image.outputs.version }}
      - name: Install pinned Poppler tools
        shell: bash
        # Worst case is 3 x (120s update + 120s install) + 2 x 10s sleep, ~12.3 min.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash scripts/ci-apt-install.sh "$RUNNER_TEMP/apt-poppler" poppler-utils
          # The cache is an accelerator, never the source of truth: the pinned version is
          # asserted on whatever got installed.
          expected="$(python3 -c 'import json; print(json.load(open("fixtures/pdf-parity/public/manifest.json", encoding="utf-8"))["pins"]["poppler_version"])')"
          actual="$(pdfinfo -v 2>&1 | sed -n '1p')"
          echo "pdfinfo: $actual"
          test "$actual" = "$expected"
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      # The script keeps and re-verifies hash-matching files in this directory ("cached"), so a
      # restored cache means no download; every file is checked against the manifest hash.
      - name: Restore parity font cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures/pdf-parity/fonts
          key: pdf-parity-fonts-${{ hashFiles('fixtures/pdf-parity/public/manifest.json') }}
      - name: Fetch exact OFL fonts
        shell: bash
        # Covers the download budget scripts/fetch-pdf-parity-fonts.sh documents: 2 fonts at
        # (150 s retry window + 120 s last attempt) = 9 min worst case, plus 3 min of margin. Only
        # a cold cache pays any of it.
        timeout-minutes: 12
        run: bash scripts/fetch-pdf-parity-fonts.sh
      - name: Build hwp
        run: cargo build --locked -p hwp-cli
      - name: Public PDF parity oracle
        shell: bash
        env:
          HWP_FONT_DIR: fixtures/pdf-parity/fonts
        run: bash scripts/pdf-parity.sh run --oracle-dir fixtures/pdf-parity/public/oracle
      - name: Upload numeric parity scorecards
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-parity-scoreboard
          path: fixtures/pdf-parity/public/scoreboard/
          if-no-files-found: error
          retention-days: 7

  test:
    name: test (${{ matrix.os }})
    needs: decision
    if: needs.decision.outputs.run_full == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # All three are required gates: ubuntu (CI baseline) + macOS (owner's main
          # platform) + windows (MSVC build/tests, and the release binaries come from here).
          - { os: ubuntu-latest }
          - { os: macos-latest }
          - { os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Render smoke tests need a system Korean font. fonts-nanum ships glyf-outline TTFs;
      # the CFF-based fonts-noto-cjk made debug-build outline extraction ~100x slower
      # (that alone was a 15-minute ubuntu test step).
      # Bounded and retried: a hung apt mirror used to consume the job's whole
      # 30-minute budget in this one step, which cancelled the job before the
      # toolchain, the cache and the Test step had run at all - so ubuntu reported
      # a failure without a single test having executed. A normal install takes
      # well under a minute; three bounded attempts fail fast and recover from a
      # transient mirror, and the step still fails loudly if fonts genuinely
      # cannot be installed (the render smoke tests need them).
      - name: Identify the runner image (cache key)
        if: runner.os == 'Linux'
        id: image
        shell: bash
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      # Same cache-then-bounded-network install as the Poppler step above: a warm run installs
      # fonts-nanum from cached .deb files with downloads forbidden.
      - name: Restore Korean font package cache
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-fonts
          key: apt-fonts-${{ steps.image.outputs.version }}
      - name: Install Korean fonts (for rendering tests)
        if: runner.os == 'Linux'
        # Must exceed the install script's worst case (3 x (120s update + 120s install) + 2 x
        # 10s sleep, ~12.3 min); a smaller budget can cut the last retry short.
        timeout-minutes: 15
        run: bash scripts/ci-apt-install.sh "$RUNNER_TEMP/apt-fonts" fonts-nanum
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      # fixtures/hwp5 and fixtures/hwpx are gitignored (data policy), so this run is reduced in
      # scope; print by how much (#275). HWP_REQUIRE_FIXTURES is deliberately not set: without the
      # fixtures it would always fail. The strict run is a local pre-release item in
      # docs/release-readiness.md.
      - name: Test
        shell: bash
        run: |
          export HWP_FIXTURE_SKIP_LOG="$RUNNER_TEMP/fixture-skips.log"
          rm -f "$HWP_FIXTURE_SKIP_LOG"
          status=0
          cargo test --workspace || status=$?
          skipped=0
          optional=0
          if [ -f "$HWP_FIXTURE_SKIP_LOG" ]; then
            skipped="$(awk 'END {print NR}' "$HWP_FIXTURE_SKIP_LOG")"
            optional="$(awk -F'\t' '$3 == "optional" {n++} END {print n+0}' "$HWP_FIXTURE_SKIP_LOG")"
          fi
          # A failed run stopped early, so its count is partial (#350).
          partial=""
          [ "$status" -eq 0 ] || partial=" (partial)"
          echo "skipped-for-missing-fixtures=$skipped (optional=$optional)$partial"
          exit "$status"

  # Configure this stable name as the only required PR check. Evaluate failed/cancelled/skipped
  # dependencies, and accept skips only when decision explicitly proved a lightweight run.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [decision, lint, pdf-parity, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: CI gate policy self-tests
        run: python3 -m unittest tools/test_ci_gate.py
      - name: All required results succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_gate.py aggregate
